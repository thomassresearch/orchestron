name: Publish Docker image

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish (for example, 2.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Share the lock with cleanup so it cannot remove an in-flight upload.
# Queue tag pushes instead of replacing a pending release build.
concurrency:
  group: ghcr-images-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve the release tag and image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          image_tag=$(printf '%s' "$RELEASE_TAG" | sed -E 's/[^a-zA-Z0-9_.-]+/-/g')
          if [[ ! "$image_tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::The release tag must produce a valid Docker tag of at most 128 characters.'
            exit 1
          fi
          image_name=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$image_name" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Automatic runs build the push's exact commit. Manual runs resolve
          # only refs/tags/, so a branch with the same name cannot be published.
          ref: ${{ github.event_name == 'push' && github.sha || steps.image.outputs.ref }}
          persist-credentials: false

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Detached checkouts may have no local tag ref for Git context to
          # infer. Supply the checked-out source revision explicitly.
          context: workflow
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.tag }},priority=600
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          # The image is retained in GHCR; Docker build records would add Actions artifacts.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=orchestron-release
          cache-to: type=gha,mode=max,scope=orchestron-release
