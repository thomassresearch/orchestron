name: Clean up Docker images

on:
  workflow_run:
    workflows: ['Publish Docker image']
    types: [completed]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without removing images
        type: boolean
        default: true

permissions:
  actions: write
  packages: write

# Must match docker-publish.yml, including the queue policy.
concurrency:
  group: ghcr-images-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove Docker build record artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          artifact_ids=$(gh api --paginate \
            "repos/$REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | endswith(".dockerbuild")) | .id')
          if [ -z "$artifact_ids" ]; then
            echo 'No Docker build record artifacts to delete.'
            exit 0
          fi
          while IFS= read -r artifact_id; do
            gh api --method DELETE "repos/$REPOSITORY/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"

      - name: Resolve the package name
        id: package
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          package="${REPOSITORY#*/}"
          echo "name=${package,,}" >> "$GITHUB_OUTPUT"

      # Keep release indices plus their platform/attestation manifests.
      # A generic package-version count can delete manifests still in use.
      - name: Keep the two newest images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ steps.package.outputs.name }}
          keep-n-tagged: '2'
          delete-untagged: 'true'
          validate: 'true'
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
