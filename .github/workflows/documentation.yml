name: User manual

on:
  pull_request:
    paths:
      - 'documentation/**'
      - 'screenshots/**'
      - 'specifications/**'
      - 'examples/**'
      - 'integrations/**'
      - 'README.md'
      - 'tools/manual*'
      - 'tools/build_user_docs_pdf.mjs'
      - 'tools/check_user_docs_pdf.py'
      - '.codex/hooks/**'
      - 'Makefile'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check hierarchy, navigation, links and heading guard
        run: make docs-check
