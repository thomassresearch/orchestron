[project]
name = "sung-melody-transcription"
version = "0.1.0"
description = "Auditable RMVPE sung-melody transcription and FluidSynth piano previews."
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3", "librosa==0.11.0", "numpy>=2,<3",
  "scipy>=1.14,<2", "mido==1.3.3", "soundfile>=0.13,<0.14",
]

[project.scripts]
sung-melody = "sung_melody.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sung_melody"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/sung_melody/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
