[project]
name = "visualcsound-backend"
version = "0.1.0"
description = "Backend services for VisualCSound"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "sqlalchemy>=2.0.43",
  "mido>=1.3.3",
  "ctcsound>=6.17.1",
  "numpy>=2.0.0",
  "pyopenssl==26.2.0",
  "urllib3>=2.7.0",
  "idna>=3.18",
  "starlette>=1.3.1",
  "cryptography>=48.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.16",
  "httpx>=0.28.1",
  "requests>=2.33.0",
  "beautifulsoup4>=4.14.0",
  "lxml>=6.1.0"
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Start with correctness checks that the existing repository can enforce without
# mixing a broad style rewrite into the architecture refactor.
select = ["E4", "E7", "E9", "F"]
