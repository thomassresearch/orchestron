root.addEventListener('input',e=>{const el=e.target,k=el.dataset.field;if(k==='gain'){const i=Number(el.dataset.inst);state.gains[i]=Number(el.value);$('#o-gain-'+i).textContent=el.value+' dB';state.dirty=true;}else if(k==='send'){const i=Number(el.dataset.inst);state.sends[i]=Number(el.value);$('#o-send-'+i).textContent=el.value+' dB';state.dirty=true;}else if(k==='param'){const name=el.dataset.param;state.params[name]=Number(el.value);const output=$('#o-param-'+name);output.textContent=el.value;el.closest('.o-knob').querySelector('.o-knob-face').style.setProperty('--rot',(-120+240*(Number(el.value)-Number(el.min))/(Number(el.max)-Number(el.min)))+'deg');state.dirty=true;}else if(k==='search'){const q=el.value.toLowerCase();root.querySelectorAll('[data-search]').forEach(x=>x.hidden=!x.dataset.search.includes(q));}$('#o-save-status').textContent=state.dirty?'Unsaved changes':'Saved';});

root.addEventListener('keydown',e=>{if(e.key==='Escape'&&resizeGesture){e.preventDefault();e.stopPropagation();finishResize(true);return;}if(e.key==='Escape'){if(state.modal){state.modal=null;renderOverlay();$('.o-project-name').focus();}else if(state.focus){state.focus=false;render();}else if(state.held.length){state.held=[];renderDetail();}}if(e.key==='Tab'&&state.modal){const els=[...$('#o-overlay').querySelectorAll('button:not(:disabled),input,select,textarea')].filter(x=>!x.hidden);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
