[package]
name = "coordinator-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1", features = ["float_roundtrip"]}

[profile.release]
lto = true
codegen-units = 1
